<script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6dNuSW3ZwXRVIf9ppIeFe-ZT3_UvzDH5bN1BEYA-NGGf1Qxw0OYT9Efx6p7NRyqG5/exec";
        let allMembers = [];

        // ----------------------------------------------------------------------
        // FONCTION : Récupération dynamique des membres via JSONP
        // ----------------------------------------------------------------------
        function fetchMembers() {
            const oldScript = document.getElementById('jsonp-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-script';
            script.src = `${SCRIPT_URL}?action=getmembers&callback=handleResponse&_=` + new Date().getTime();
            document.body.appendChild(script);
        }

        // ----------------------------------------------------------------------
        // FONCTION : Traitement de la réponse retournée par Google Apps Script
        // ----------------------------------------------------------------------
        window.handleResponse = function(data) {
            if (data && data.status === "success" && data.members && data.members.length > 0) {
                allMembers = data.members;
                updateStats();
                filterMembers(); // Applique le filtre actuel (ou affiche tout si la recherche est vide)
            } else {
                document.getElementById("member-list").innerHTML = `<p style="text-align:center; color:#94a3b8; padding: 15px;">Aucun membre trouvé.</p>`;
            }
        };

        // ----------------------------------------------------------------------
        // FONCTION : Mise à jour des compteurs (In, Out, Inscrits)
        // ----------------------------------------------------------------------
        function updateStats() {
            let inCount = 0;
            let outCount = 0;

            allMembers.forEach(m => {
                let st = (m.statut || "").toString().trim().toLowerCase();
                if (st.includes("présent") || st.includes("present")) inCount++;
                if (st.includes("sorti")) outCount++;
            });

            document.getElementById("count-in").innerText = inCount;
            document.getElementById("count-out").innerText = outCount;
            document.getElementById("count-inscrits").innerText = allMembers.length;
        }

        // ----------------------------------------------------------------------
        // FONCTION : Affichage HTML de la liste des membres
        // ----------------------------------------------------------------------
        function renderList(members) {
            const container = document.getElementById("member-list");
            if (members.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 15px;">Aucun résultat</p>`;
                return;
            }

            container.innerHTML = members.map(m => {
                let nom = m.nom || "Membre";
                let id = m.id || "";
                
                let photo = (m.photoUrl && m.photoUrl.startsWith("http")) ? m.photoUrl : 'logo.png';
                
                let st = (m.statut || "Inscrit").toString().trim();
                let stLower = st.toLowerCase();
                
                let badgeClass = "inscrit";
                if (stLower.includes("présent") || stLower.includes("present")) badgeClass = "present";
                if (stLower.includes("sorti")) badgeClass = "sorti";

                let heureDisplay = m.heure ? `<span class="heure-text">${m.heure}</span>` : '';

                return `
                    <div class="member-item">
                        <div class="member-left">
                            <img src="${photo}" class="member-photo" alt="Photo" onerror="this.src='logo.png'">
                            <div class="member-details">
                                <div class="member-name">${nom}</div>
                                <div class="member-id">${id}</div>
                            </div>
                        </div>
                        <div class="member-right">
                            <span class="status-badge ${badgeClass}">${st}</span>
                            ${heureDisplay}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ----------------------------------------------------------------------
        // FONCTION : Filtrage dynamique lors de la recherche
        // ----------------------------------------------------------------------
        function filterMembers() {
            const query = document.getElementById("search-input").value.toLowerCase().trim();
            const filtered = allMembers.filter(m => {
                let nom = (m.nom || "").toLowerCase();
                let id = (m.id || "").toLowerCase();
                return nom.includes(query) || id.includes(query);
            });
            renderList(filtered);
        }

        // Lancement immédiat et boucle de rafraîchissement toutes les 5 secondes
        fetchMembers();
        setInterval(fetchMembers, 5000);
    </script>
