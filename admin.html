<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Administration - ASTER</title>

  <style>
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
    }

    .card-container {
      max-width: 520px;
      width: 100%;
      margin: 20px auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    .logo-container {
      margin: 0 auto 15px auto;
      max-width: 110px;
      width: 100%;
    }
    
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      color: #2d3748;
      margin: 5px 0 15px 0;
      font-size: 1.35em;
      font-weight: 700;
    }

    .counters-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .counter-badge {
      display: inline-flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 6px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85em;
      color: #4a5568;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .counter-badge span {
      margin-left: 6px;
      padding: 2px 8px;
      border-radius: 12px;
      color: white;
      font-size: 0.9em;
    }

    .badge-in span { background-color: #17a2b8; }
    .badge-out span { background-color: #e53e3e; }
    .badge-total span { background-color: #007bff; }

    .search-box {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #cbd5e0;
      border-radius: 12px;
      font-size: 0.95em;
      outline: none;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: #17a2b8;
      box-shadow: 0 0 0 3px rgba(23, 162, 184, 0.15);
    }

    .members-list {
      max-height: 400px;
      overflow-y: auto;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .member-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #edf2f7;
    }

    .member-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .member-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e2e8f0;
      background-color: #edf2f7;
    }

    .member-info {
      display: flex;
      flex-direction: column;
    }

    .member-name {
      font-weight: bold;
      color: #2d3748;
      font-size: 0.9em;
      text-transform: uppercase;
    }

    .member-id {
      font-size: 0.73em;
      color: #718096;
    }

    .member-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .status-pill {
      font-size: 0.72em;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: bold;
      color: white;
    }

    .status-present { background-color: #17a2b8; }
    .status-out { background-color: #e53e3e; }
    .status-none { background-color: #a0aec0; }

    .time-info {
      font-size: 0.7em;
      color: #718096;
      font-weight: 500;
    }

    .msg-state {
      padding: 20px;
      color: #718096;
      font-size: 0.95em;
      text-align: center;
    }

    .msg-error {
      color: #e53e3e;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="logo-container">
      <img src="logo.png" alt="Logo ASTER" id="app-logo">
    </div>

    <h2>Liste des Inscrits</h2>

    <div class="counters-container">
      <div class="counter-badge badge-in">In: <span id="countIn">0</span></div>
      <div class="counter-badge badge-out">Out: <span id="countOut">0</span></div>
      <div class="counter-badge badge-total">Inscrits: <span id="countTotal">0</span></div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Rechercher un membre par nom ou ID..." onkeyup="filtrerMembres()">

    <div class="members-list" id="membersList">
      <div class="msg-state">Chargement des inscrits...</div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6dNuSW3ZwXRVIf9ppIeFe-ZT3_UvzDH5bN1BEYA-NGGf1Qxw0OYT9Efx6p7NRyqG5/exec";
    
    let tousLesMembres = [];

    window.addEventListener("load", () => {
      chargerAdminData();
    });

    function chargerAdminData() {
      fetch(`${SCRIPT_URL}?action=admin_list`)
        .then(res => {
          if (!res.ok) throw new Error("Erreur réseau");
          return res.json();
        })
        .then(data => {
          if (data.status === "ok") {
            tousLesMembres = data.membres || [];
            mettreAJourCompteurs(tousLesMembres);
            afficherMembres(tousLesMembres);
          } else {
            document.getElementById("membersList").innerHTML = `<div class="msg-state msg-error">Échec du chargement des inscrits.</div>`;
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById("membersList").innerHTML = `<div class="msg-state msg-error">Impossible de joindre le serveur.</div>`;
        });
    }

    function mettreAJourCompteurs(membres) {
      let nbIn = membres.filter(m => m.statut === "Présent").length;
      let nbOut = membres.filter(m => m.statut === "Sorti").length;
      let nbTotal = membres.length;

      document.getElementById("countIn").innerText = nbIn;
      document.getElementById("countOut").innerText = nbOut;
      document.getElementById("countTotal").innerText = nbTotal;
    }

    function afficherMembres(membres) {
      const listContainer = document.getElementById("membersList");
      
      if (membres.length === 0) {
        listContainer.innerHTML = `<div class="msg-state">Aucun membre trouvé.</div>`;
        return;
      }

      let html = "";
      membres.forEach(m => {
        let statutClass = "status-none";
        let statutTexte = m.statut || "Inscrit";
        if (m.statut === "Présent") statutClass = "status-present";
        else if (m.statut === "Sorti") statutClass = "status-out";
        else if (m.statut === "Non scanné") statutTexte = "Inscrit";

        let timeHtml = "";
        if (m.statut === "Présent" && m.arrivee) {
          timeHtml = `<span class="time-info">Arrivée : ${m.arrivee}</span>`;
        } else if (m.statut === "Sorti" && m.depart) {
          timeHtml = `<span class="time-info">Départ : ${m.depart}</span>`;
        }

        let photoUrl = m.photo && m.photo.startsWith("http") ? m.photo : "https://via.placeholder.com/150?text=?";

        html += `
          <div class="member-item">
            <div class="member-left">
              <img src="${photoUrl}" alt="Photo" class="member-avatar" onerror="this.src='https://via.placeholder.com/150?text=?'">
              <div class="member-info">
                <span class="member-name">${m.name || "Inconnu"}</span>
                <span class="member-id">${m.id || ""}</span>
              </div>
            </div>
            <div class="member-right">
              <span class="status-pill ${statutClass}">${statutTexte}</span>
              ${timeHtml}
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    function filtrerMembres() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtres = tousLesMembres.filter(m => {
        const nom = (m.name || "").toLowerCase();
        const id = (m.id || "").toLowerCase();
        return nom.includes(query) || id.includes(query);
      });
      afficherMembres(filtres);
    }
  </script>
</body>
</html>
