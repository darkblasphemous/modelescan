<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - ASTER</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 10px;
            object-fit: contain;
        }
        h2 {
            color: #1e293b;
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 15px 0;
            text-align: center;
        }
        
        .stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-pill {
            background: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge-count {
            padding: 2px 8px;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: 800;
        }
        .bg-in { background-color: #00c896; }
        .bg-out { background-color: #ef4444; }
        .bg-inscrits { background-color: #0066ff; }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px 16px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
            color: #334155;
            background-color: #fff;
        }
        .search-box::placeholder {
            color: #94a3b8;
        }

        .member-list {
            max-height: 440px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .member-list::-webkit-scrollbar {
            width: 8px;
        }
        .member-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .member-list::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }

        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 4px;
            border-bottom: 1px solid #f1f5f9;
        }
        .member-item:last-child {
            border-bottom: none;
        }
        .member-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .member-photo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #e2e8f0;
        }
        .member-details {
            display: flex;
            flex-direction: column;
        }
        .member-name {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }
        .member-id {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .member-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-badge.present {
            background-color: #e6f9f4;
            color: #00c896;
        }
        .status-badge.sorti {
            background-color: #feefef;
            color: #ef4444;
        }
        .status-badge.inscrit {
            background-color: #f1f5f9;
            color: #94a3b8;
        }
        .heure-text {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 3px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="logo.png" alt="ASTER" class="logo">
        <h2>Liste des Inscrits</h2>

        <div class="stats-container">
            <div class="stat-pill">In: <span class="badge-count bg-in" id="count-in">0</span></div>
            <div class="stat-pill">Out: <span class="badge-count bg-out" id="count-out">0</span></div>
            <div class="stat-pill">Inscrits: <span class="badge-count bg-inscrits" id="count-inscrits">0</span></div>
        </div>

        <div class="card">
            <input type="text" id="search-input" class="search-box" placeholder="Rechercher un membre par nom ou ID..." oninput="filterMembers()">
            
            <div class="member-list" id="member-list">
                <p style="text-align: center; color: #94a3b8; padding: 15px;">Chargement des données...</p>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6dNuSW3ZwXRVIf9ppIeFe-ZT3_UvzDH5bN1BEYA-NGGf1Qxw0OYT9Efx6p7NRyqG5/exec";
        let allMembers = [];

        function fetchMembers() {
            // Utilisation exacte de la requête action=getMembers
            fetch(`${SCRIPT_URL}?action=getMembers`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.members) {
                        allMembers = data.members;
                        updateStats();
                        renderList(allMembers);
                    } else if (Array.isArray(data)) {
                        allMembers = data;
                        updateStats();
                        renderList(allMembers);
                    } else {
                        document.getElementById("member-list").innerHTML = `<p style="text-align:center; color:#94a3b8; padding: 15px;">Aucun membre trouvé.</p>`;
                    }
                })
                .catch(err => {
                    console.error("Erreur:", err);
                    document.getElementById("member-list").innerHTML = `<p style="text-align:center; color:#ef4444; padding: 15px;">Erreur de chargement</p>`;
                });
        }

        function updateStats() {
            let inCount = 0;
            let outCount = 0;

            allMembers.forEach(m => {
                let st = (m.statut || m.Statut || "").toString().trim().toLowerCase();
                if (st === "présent" || st === "present") inCount++;
                if (st === "sorti") outCount++;
            });

            document.getElementById("count-in").innerText = inCount;
            document.getElementById("count-out").innerText = outCount;
            document.getElementById("count-inscrits").innerText = allMembers.length;
        }

        function renderList(members) {
            const container = document.getElementById("member-list");
            if (members.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 15px;">Aucun résultat</p>`;
                return;
            }

            container.innerHTML = members.map(m => {
                let nom = m.nom || m.Nom || "Inconnu";
                let id = m.id || m.ID || m.code || "";
                let photo = m.photoUrl || m.photo || 'logo.png';
                let st = (m.statut || m.Statut || "Inscrit").toString().trim();
                let stLower = st.toLowerCase();
                
                let badgeClass = "inscrit";
                if (stLower === "présent" || stLower === "present") badgeClass = "present";
                if (stLower === "sorti") badgeClass = "sorti";

                let heure = m.heure || m.Heure || m.Arrivée || m.Arrivee || "";
                let heureDisplay = heure ? `<span class="heure-text">${heure}</span>` : '';

                return `
                    <div class="member-item">
                        <div class="member-left">
                            <img src="${photo}" class="member-photo" alt="Photo">
                            <div class="member-details">
                                <div class="member-name">${nom}</div>
                                <div class="member-id">${id}</div>
                            </div>
                        </div>
                        <div class="member-right">
                            <span class="status-badge ${badgeClass}">${st}</span>
                            ${heureDisplay}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterMembers() {
            const query = document.getElementById("search-input").value.toLowerCase().trim();
            const filtered = allMembers.filter(m => {
                let nom = (m.nom || m.Nom || "").toLowerCase();
                let id = (m.id || m.ID || m.code || "").toLowerCase();
                return nom.includes(query) || id.includes(query);
            });
            renderList(filtered);
        }

        fetchMembers();
        setInterval(fetchMembers, 5000);
    </script>
</body>
</html>
