<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle des Sorties - ASTER</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
        .logo { width: 110px; height: 110px; margin: 0 auto 15px auto; object-fit: contain; display: block; }
        h2 { color: #1e293b; font-size: 22px; margin: 0 0 20px 0; font-weight: 700; }
        .member-photo { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid #00c896; margin: 0 auto 20px auto; display: block; }
        .status-box { padding: 20px 15px; border-radius: 14px; color: white; margin-bottom: 20px; }
        .status-box.green { background-color: #00b4d8; }
        .status-box.orange { background-color: #f97316; }
        .status-box.red { background-color: #ef4444; }
        .status-box p { margin: 0 0 5px 0; font-size: 15px; font-weight: bold; }
        .status-box h3 { margin: 0; font-size: 20px; text-transform: uppercase; font-weight: 800; }
        .btn-container { display: flex; gap: 10px; }
        .btn { flex: 1; background-color: #0066ff; color: white; border: none; padding: 14px 10px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="card" id="card-content">
        <img src="logo.png" class="logo">
        <h2>Contrôle des Sorties</h2>
        <p>Validation en cours...</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6dNuSW3ZwXRVIf9ppIeFe-ZT3_UvzDH5bN1BEYA-NGGf1Qxw0OYT9Efx6p7NRyqG5/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('id') || urlParams.get('code');
        const container = document.getElementById("card-content");

        if (!code) {
            container.innerHTML = `
                <img src="logo.png" class="logo">
                <h2>Contrôle des Sorties</h2>
                <div class="status-box red"><p>⚠️ Erreur : Identifiant manquant</p></div>
            `;
        } else {
            fetch(`${SCRIPT_URL}?action=sortie&code=${encodeURIComponent(code)}`)
                .then(res => res.json())
                .then(data => {
                    let photoHtml = data.photo ? `<img src="${data.photo}" class="member-photo">` : '';
                    if (data.status === "ok") {
                        container.innerHTML = `
                            <img src="logo.png" class="logo">
                            <h2>Contrôle des Sorties</h2>
                            ${photoHtml}
                            <div class="status-box green">
                                <p>✓ SORTIE VALIDÉE</p>
                                <h3>${data.name}</h3>
                                <div style="font-size:12px; margin-top:5px;">ID : ${data.id}</div>
                            </div>
                            <button class="btn" style="width:100%" onclick="location.reload();">Scanner un autre</button>
                        `;
                    } else if (data.status === "require_survey") {
                        container.innerHTML = `
                            <img src="logo.png" class="logo">
                            <h2>Contrôle des Sorties</h2>
                            ${photoHtml}
                            <div class="status-box orange">
                                <p>⚠️ Veuillez remplir l'enquête de satisfaction avant de sortir.</p>
                                <h3>${data.name}</h3>
                            </div>
                            <div class="btn-container">
                                <a href="${data.surveyUrl}" class="btn" target="_blank">Remplir l'enquête</a>
                                <button class="btn" onclick="location.reload();">Scanner un autre</button>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `
                            <img src="logo.png" class="logo">
                            <h2>Contrôle des Sorties</h2>
                            <div class="status-box red"><p>${data.message}</p></div>
                            <button class="btn" style="width:100%" onclick="location.reload();">Réessayer</button>
                        `;
                    }
                });
        }
    </script>
</body>
</html>
