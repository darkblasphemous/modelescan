<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle des Sorties - ASTER</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 440px;
            box-sizing: border-box;
        }
        /* Taille exacte du logo alignée sur l'entrée */
        .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .avatar-container {
            margin-bottom: 22px;
            display: flex;
            justify-content: center;
        }
        /* Taille exacte de la photo du membre alignée sur l'entrée */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #10b981;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.25);
            background-color: #e2e8f0;
        }
        /* Boîte Turquoise exacte pour la sortie validée */
        .alert-box-success {
            background-color: #0e94b2;
            color: white;
            padding: 24px 20px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 6px 18px rgba(14, 148, 178, 0.3);
            text-align: center;
        }
        .alert-box-success p {
            margin: 0 0 6px 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .alert-box-success .member-name {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        .alert-box-success .member-id {
            font-size: 13.5px;
            font-weight: 500;
            opacity: 0.95;
            letter-spacing: 0.3px;
        }
        /* Bouton unique */
        .buttons-group {
            display: flex;
            justify-content: center;
        }
        .btn {
            width: 100%;
            padding: 14px 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo intégré directement -->
        <img src="logo.png" alt="Logo ASTER" class="logo">
        
        <h2>Contrôle des Sorties</h2>

        <!-- Photo du membre -->
        <div class="avatar-container">
            <img id="member-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Photo membre" class="avatar">
        </div>

        <!-- Affichage direct du résultat validé -->
        <div id="dynamic-content">
            <div class="alert-box-success">
                <p>✓ SORTIE VALIDÉE</p>
                <span class="member-name">alan wilder</span>
                <span class="member-id">ID : ASTER-EVENEMENT2026-001</span>
            </div>
            <div class="buttons-group">
                <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
            </div>
        </div>
    </div>

    <script>
        function afficherResultat(response) {
            const avatarImg = document.getElementById('member-avatar');
            const dynamicContent = document.getElementById('dynamic-content');

            if (response.photoUrl) {
                avatarImg.src = response.photoUrl;
            }

            if (response.status === "success") {
                dynamicContent.innerHTML = `
                    <div class="alert-box-success">
                        <p>✓ SORTIE VALIDÉE</p>
                        <span class="member-name">${response.nom}</span>
                        <span class="member-id">ID : ${response.id}</span>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
                    </div>
                `;
            }
        }

        function nouveauScan() {
            location.reload();
        }
    </script>
</body>
</html>
