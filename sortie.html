<script>
        // Récupération automatique de l'ID passé dans l'URL (ex: sortie.html?code=12345)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codeMembre = urlParams.get('code') || urlParams.get('id');

            if (codeMembre) {
                appelerAPI(codeMembre);
            }
        };

        // Fonction qui interroge ton script Google Apps Script (doGet)
        function appelerAPI(code) {
            // ⚠️ Remplace cette URL par l'URL de déploiement web de ton script Apps Script
            const urlAppsScript = "VOTRE_URL_DEPLOIEMENT_APPS_SCRIPT?action=sortie&code=" + encodeURIComponent(code);

            fetch(urlAppsScript)
                .then(response => response.json())
                .then(data => {
                    afficherResultat(data);
                })
                .catch(error => {
                    console.error("Erreur de connexion avec l'API :", error);
                });
        }

        function afficherResultat(response) {
            const avatarImg = document.getElementById('member-avatar');
            const dynamicContent = document.getElementById('dynamic-content');

            if (response && response.photoUrl) {
                avatarImg.src = response.photoUrl;
            }

            if (response && response.status === "require_survey") {
                dynamicContent.innerHTML = `
                    <div class="alert-box-orange">
                        <p>⚠️ Veuillez remplir l'enquête de satisfaction avant de sortir.</p>
                        <strong>${response.nom}</strong>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" onclick="ouvrirEnquete('${response.id}')">Remplir l'enquête</button>
                        <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
                    </div>
                `;
            } else if (response && response.status === "success") {
                dynamicContent.innerHTML = `
                    <div class="alert-box-success">
                        <p>✓ SORTIE VALIDÉE</p>
                        <span class="member-name">${response.nom}</span>
                        <span class="member-id">ID : ${response.id}</span>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
                    </div>
                `;
            } else if (response && response.status === "error") {
                dynamicContent.innerHTML = `
                    <div class="alert-box-orange">
                        <p>⚠️ Erreur</p>
                        <strong>${response.message}</strong>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" onclick="nouveauScan()">Réessayer</button>
                    </div>
                `;
            }
        }

        function ouvrirEnquete(idMembre) {
            window.open("https://docs.google.com/forms/d/e/VOTRE_FORMULAIRE/viewform?entry.ID=" + idMembre, "_blank");
        }

        function nouveauScan() {
            window.location.href = "sortie.html"; // Remet la page prête pour un nouveau scan
        }
    </script>
