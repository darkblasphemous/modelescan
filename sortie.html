<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle des Sorties - ASTER</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
        }
        h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 20px 0;
        }
        .photo-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 10px auto 20px auto;
            border: 4px solid #ff4757;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .alert-box {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .alert-success { background-color: #ff4757; color: white; }
        .alert-danger { background-color: #e2e8f0; color: #1e293b; }
        .alert-info { background-color: #e2e8f0; color: #475569; }
        
        .heure-text {
            font-size: 13px;
            font-weight: 500;
            margin-top: 6px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: #0066ff;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .input-code {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
        }
        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="ASTER" class="logo" onerror="this.style.display='none'">
        <h2>Contrôle des Sorties</h2>

        <!-- ÉCRAN 1 : Chargement -->
        <div id="screen-loading" class="screen active">
            <div class="alert-box alert-info">Enregistrement de la sortie...</div>
        </div>

        <!-- ÉCRAN 2 : Succès Sortie -->
        <div id="screen-success" class="screen">
            <div class="photo-container">
                <img id="img-success" src="" alt="Photo" onerror="this.src='logo.png'">
            </div>
            <div class="alert-box alert-success">
                <span id="name-success">Membre</span>
                <div class="heure-text">Sortie enregistrée à : <span id="time-success">--:--</span></div>
            </div>
            <button class="btn" onclick="resetPage()">Terminer</button>
        </div>

        <!-- ÉCRAN 3 : Saisie Manuelle / Erreur -->
        <div id="screen-error" class="screen">
            <div class="alert-box alert-danger" id="error-message">Aucun ID détecté.</div>
            <input type="text" id="manual-id" class="input-code" placeholder="Saisir ou scanner un ID">
            <button class="btn" onclick="validerSaisieManuelle()">Valider la Sortie</button>
            <button class="btn" style="background-color: #64748b;" onclick="resetPage()">Réinitialiser</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYuWiLA5-jMB9R80HuidPP6NqR3qCXFMHOsAwSCOrt3JU4N5QBhGx-L_YdjJ2-Xuii1g/exec";

        function convertDriveUrl(url) {
            if (!url || !url.startsWith("http")) return "logo.png";
            if (url.includes("drive.google.com")) {
                let id = "";
                const matchId = url.match(/\/d\/([^\/]+)/);
                const matchQuery = url.match(/id=([^&]+)/);
                if (matchId && matchId[1]) id = matchId[1];
                else if (matchQuery && matchQuery[1]) id = matchQuery[1];
                if (id) return `https://lh3.googleusercontent.com/d/${id}`;
            }
            return url;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showLoadingScreen() { showScreen('screen-loading'); }

        function showSuccessScreen(nom, photo, heure) {
            document.getElementById('name-success').innerText = nom || "Membre";
            document.getElementById('time-success').innerText = heure || "--:--";
            document.getElementById('img-success').src = convertDriveUrl(photo);
            showScreen('screen-success');
        }

        function showErrorScreen(msg) {
            document.getElementById('error-message').innerText = msg;
            showScreen('screen-error');
        }

        function resetPage() {
            window.location.href = window.location.pathname;
        }

        function validerSaisieManuelle() {
            const val = document.getElementById('manual-id').value;
            if (val) {
                validerSortie(val);
            }
        }

        function validerSortie(idScanne) {
            if (!idScanne || idScanne.trim() === "" || idScanne === "undefined" || idScanne === "null") {
                showErrorScreen("ID manquant ou invalide.");
                return;
            }

            showLoadingScreen();

            const oldScript = document.getElementById('jsonp-scan-script');
            if (oldScript) oldScript.remove();

            const cleanId = idScanne.trim();
            // Utilisation explicite de action=sortie
            const url = `${SCRIPT_URL}?action=sortie&id=${encodeURIComponent(cleanId)}&callback=handleScanResponse&_=${new Date().getTime()}`;

            const script = document.createElement('script');
            script.id = 'jsonp-scan-script';
            script.src = url;
            
            script.onerror = function() {
                showErrorScreen("Erreur de connexion au serveur.");
            };

            document.body.appendChild(script);
        }

        window.handleScanResponse = function(response) {
            console.log("Réponse serveur :", response);

            if (response.status === "success") {
                showSuccessScreen(response.nom, response.photoUrl, response.heure);
            } else {
                showErrorScreen(response.message || "Erreur lors de la validation.");
            }
        };

        // Détection globale de tous les noms de paramètres URL possibles
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const scannedId = urlParams.get('id') || 
                              urlParams.get('code') || 
                              urlParams.get('qr') || 
                              urlParams.get('user') || 
                              urlParams.get('member') || 
                              urlParams.get('idUnique');

            if (scannedId && scannedId.trim() !== "") {
                validerSortie(scannedId);
            } else {
                showErrorScreen("Aucun ID trouvé dans l'URL. Veuillez le saisir ci-dessous :");
            }
        });
    </script>
</body>
</html>
