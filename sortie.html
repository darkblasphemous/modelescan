<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f6f9">

  <title>Contrôle des Sorties & Enquête - ASTER</title>

  <style>
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }

    .card-container {
      max-width: 480px;
      width: 100%;
      margin: 20px auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    .logo-container {
      margin: 0 auto 15px auto;
      max-width: 120px;
      width: 100%;
    }
    
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      color: #2d3748;
      margin: 5px 0 20px 0;
      font-size: 1.35em;
      font-weight: 700;
    }

    .user-photo-container {
      margin: 20px auto;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 4px;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      border: 3px solid #00b894;
      display: none;
    }

    .user-photo-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .status-box {
      margin: 20px auto;
      width: 100%;
      padding: 22px 15px;
      border-radius: 12px;
      text-align: center;
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      font-weight: bold;
      color: #ffffff;
      word-break: break-word;
    }

    .status-loading {
      background-color: #ebf8ff;
      color: #2b6cb0;
      border: 1px solid #bee3f8;
      display: block;
      font-weight: normal;
    }

    .status-success {
      background-color: #0097b2;
    }

    .status-warning {
      background-color: #ff7f27;
    }

    .status-error {
      background-color: #e53e3e;
    }

    /* Style du formulaire d'enquête intégré */
    .survey-box {
      background-color: #fffaf0;
      border: 2px solid #ed8936;
      color: #2d3748;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      display: none;
      text-align: left;
    }

    .survey-box h3 {
      margin-top: 0;
      color: #dd6b20;
      font-size: 1.1em;
      text-align: center;
    }

    .survey-box p {
      font-size: 0.95em;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 600;
    }

    .rating-buttons {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 15px;
    }

    .rating-btn {
      flex: 1;
      padding: 10px 0;
      background: #fff;
      border: 2px solid #ed8936;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #ed8936;
      transition: all 0.2s;
    }

    .rating-btn.selected, .rating-btn:hover {
      background: #ed8936;
      color: #fff;
    }

    .survey-box textarea {
      width: 100%;
      height: 70px;
      padding: 8px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      resize: none;
      margin-bottom: 15px;
      font-family: inherit;
    }

    .msg-title {
      font-size: 1.1em;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .msg-name {
      font-size: 1.3em;
      text-transform: lowercase;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .msg-id {
      font-size: 0.9em;
      font-weight: 600;
      opacity: 0.95;
      margin-bottom: 6px;
    }

    .msg-time {
      font-size: 0.78em;
      font-weight: 400;
      opacity: 0.85;
      letter-spacing: 0.3px;
    }

    .btn-action {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,123,255,0.2);
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="logo-container">
      <img src="logo.png" alt="Logo ASTER" id="app-logo">
    </div>

    <h2>Contrôle des Sorties</h2>

    <div class="user-photo-container" id="photoContainer">
      <img id="userPhoto" src="" alt="Photo membre">
    </div>

    <!-- Boîte de statut standard (Succès / Erreur) -->
    <div id="statusMsg" class="status-box status-loading">⏳ Analyse de l'identifiant en cours...</div>

    <!-- Formulaire d'enquête si requis -->
    <div id="surveyContainer" class="survey-box">
      <h3 id="surveyMemberName"></h3>
      <p>Votre avis nous intéresse (Note de 1 à 5) :</p>
      <div class="rating-buttons" id="ratingGroup">
        <button type="button" class="rating-btn" onclick="selectRating(1)">1</button>
        <button type="button" class="rating-btn" onclick="selectRating(2)">2</button>
        <button type="button" class="rating-btn" onclick="selectRating(3)">3</button>
        <button type="button" class="rating-btn" onclick="selectRating(4)">4</button>
        <button type="button" class="rating-btn" onclick="selectRating(5)">5</button>
      </div>
      <textarea id="surveyComment" placeholder="Commentaire optionnel..."></textarea>
      <button class="btn-action" style="margin-top:0;" onclick="submitSurveyData()">Valider l'enquête & la Sortie</button>
    </div>

    <button id="btnAnother" class="btn-action" onclick="window.close()">Fermer / Terminer</button>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY5ZyTj5L2QXDzTKknCcEK5HKqVQOELj2wqb4otBXciSZanFQdd5PgY75iKaewHITF/exec";
    let globalMemberId = "";
    let selectedNote = 5; // Note par défaut

    function selectRating(note) {
      selectedNote = note;
      document.querySelectorAll('.rating-btn').forEach((btn, index) => {
        if (index + 1 === note) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });
    }

    function afficherResultat(titre, nom, idMembre, heureTexte, type, photoUrl) {
      const msgBox = document.getElementById("statusMsg");
      const photoContainer = document.getElementById("photoContainer");
      const userPhoto = document.getElementById("userPhoto");
      const surveyContainer = document.getElementById("surveyContainer");

      surveyContainer.style.display = "none"; // Masquer l'enquête par défaut
      msgBox.style.display = "block";
      msgBox.className = "status-box";

      if (type === "success") {
        msgBox.classList.add("status-success");
      } else if (type === "warning") {
        msgBox.classList.add("status-warning");
      } else if (type === "error") {
        msgBox.classList.add("status-error");
      } else {
        msgBox.classList.add("status-loading");
      }

      if (type === "loading") {
        msgBox.innerText = titre;
      } else {
        let heureHtml = heureTexte ? `<div class="msg-time">Heure : ${heureTexte}</div>` : '';
        msgBox.innerHTML = `
          <div class="msg-title">${titre}</div>
          <div class="msg-name">${nom}</div>
          <div class="msg-id">ID : ${idMembre}</div>
          ${heureHtml}
        `;
      }

      if (photoUrl && photoUrl.trim() !== "" && photoUrl.length > 5) {
        userPhoto.src = photoUrl;
        photoContainer.style.display = "block";
      } else {
        photoContainer.style.display = "none";
      }
    }

    function afficherEnquete(nom, idMembre, photoUrl) {
      const msgBox = document.getElementById("statusMsg");
      const surveyContainer = document.getElementById("surveyContainer");
      const photoContainer = document.getElementById("photoContainer");
      const userPhoto = document.getElementById("userPhoto");
      const surveyMemberName = document.getElementById("surveyMemberName");

      msgBox.style.display = "none"; // Masquer le message classique
      surveyContainer.style.display = "block"; // Afficher le formulaire d'enquête
      surveyMemberName.innerText = `Enquête requise pour : ${nom}`;

      if (photoUrl && photoUrl.trim() !== "" && photoUrl.length > 5) {
        userPhoto.src = photoUrl;
        photoContainer.style.display = "block";
      } else {
        photoContainer.style.display = "none";
      }
      selectRating(5); // Sélectionner 5 par défaut
    }

    function submitSurveyData() {
      const comment = document.getElementById("surveyComment").value;
      const url = `${SCRIPT_URL}?action=submitSurvey&code=${encodeURIComponent(globalMemberId)}&note=${selectedNote}&commentaire=${encodeURIComponent(comment)}`;

      document.getElementById("surveyContainer").style.display = "none";
      afficherResultat("⏳ Enregistrement...", "", "", "", "loading", "");

      fetch(url)
        .then(res => res.json())
        .then(data => {
          const nowTime = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          if (data.status === "ok") {
            afficherResultat("✓ SORTIE VALIDÉE", globalMemberId, globalMemberId, nowTime, "success", "");
          } else {
            afficherResultat("❌ ERREUR", data.message || "Erreur", globalMemberId, "", "error", "");
          }
        })
        .catch(err => {
          afficherResultat("❌ ERREUR", "Problème réseau", globalMemberId, "", "error", "");
        });
    }

    window.addEventListener("load", () => {
      const urlParams = new URLSearchParams(window.location.search);
      globalMemberId = urlParams.get('id') || urlParams.get('code');

      if (!globalMemberId) {
        afficherResultat("ERREUR", "Aucun identifiant", "Inconnu", "", "error", "");
        return;
      }

      const url = `${SCRIPT_URL}?action=sortie&code=${encodeURIComponent(globalMemberId)}`;

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error("Erreur réseau");
          return res.json();
        })
        .then(data => {
          const nomMembre = data.name || globalMemberId;
          const nowTime = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          if (data.status === "ok") {
            afficherResultat("✓ SORTIE VALIDÉE", nomMembre, globalMemberId, nowTime, "success", data.photo);
          } else if (data.status === "require_survey") {
            // Le script demande l'enquête : on affiche le formulaire interactif
            afficherEnquete(nomMembre, globalMemberId, data.photo);
          } else if (data.status === "already_scanned") {
            afficherResultat("⚠ DÉJÀ ENREGISTRÉ", nomMembre, globalMemberId, nowTime, "warning", data.photo);
          } else {
            afficherResultat("❌ ERREUR", data.message || "Problème d'accès", globalMemberId, "", "error", data.photo);
          }
        })
        .catch(err => {
          console.error(err);
          afficherResultat("❌ ERREUR", "Impossible de joindre le serveur", globalMemberId, "", "error", "");
        });
    });
  </script>
</body>
</html>
