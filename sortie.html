<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contrôle des Sorties - ASTER</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 420px;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }
        h2 {
            color: #1e293b;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .avatar-container {
            margin-bottom: 25px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #10b981; /* Bordure verte ou neutre selon le statut */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* Boîte d'alerte Orange pour l'enquête */
        .alert-box-orange {
            background-color: #f97316;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }
        .alert-box-orange p {
            margin: 0 0 8px 0;
            font-size: 15px;
            font-weight: 500;
        }
        .alert-box-orange strong {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .buttons-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <!-- Logo ASTER -->
        <img src="URL_DE_VOTRE_LOGO" alt="Logo ASTER" class="logo">
        
        <h2>Contrôle des Sorties</h2>

        <!-- Avatar du Membre -->
        <div class="avatar-container">
            <img id="member-avatar" src="" alt="Photo membre" class="avatar">
        </div>

        <!-- Zone dynamique gérée par le script -->
        <div id="dynamic-content">
            <!-- Inséré dynamiquement par JavaScript selon la réponse du serveur -->
        </div>
    </div>

    <script>
        // Exemple de fonction qui traite la réponse JSONP/JSON du serveur
        function afficherResultatSortie(response) {
            const avatarImg = document.getElementById('member-avatar');
            const dynamicContent = document.getElementById('dynamic-content');

            // Affichage de la photo
            avatarImg.src = response.photoUrl || 'default-avatar.png';

            // Si le serveur renvoie le statut require_survey (Enquête non faite)
            if (response.status === "require_survey") {
                dynamicContent.innerHTML = `
                    <div class="alert-box-orange">
                        <p>⚠️ Veuillez remplir l'enquête de satisfaction avant de sortir.</p>
                        <strong>${response.nom}</strong>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" onclick="ouvrirEnquete('${response.id}')">Remplir l'enquête</button>
                        <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
                    </div>
                `;
            } 
            // Si la sortie est validée normalement
            else if (response.status === "success") {
                dynamicContent.innerHTML = `
                    <div style="background-color: #ef4444; color: white; padding: 20px; border-radius: 12px; margin-bottom: 25px;">
                        <p style="margin:0 0 5px 0;">✓ SORTIE ENREGISTRÉE</p>
                        <strong>${response.nom}</strong>
                    </div>
                    <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
                `;
            }
        }

        function ouvrirEnquete(idMembre) {
            // Lien vers votre formulaire ou page d'enquête
            window.open("https://docs.google.com/forms/d/e/VOTRE_FORMULAIRE/viewform?entry.ID=" + idMembre, "_blank");
        }

        function nouveauScan() {
            location.reload(); // Recharge la page pour un nouveau scan
        }
    </script>
</body>
</html>
