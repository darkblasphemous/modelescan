<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle des Sorties - ASTER</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 440px;
            box-sizing: border-box;
        }
        /* Le vrai logo rond d'origine */
        .logo {
            width: 95px;
            height: 95px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            margin-top: 5px;
            margin-bottom: 20px;
        }
        .avatar-container {
            margin-bottom: 22px;
            display: flex;
            justify-content: center;
        }
        .avatar {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            background-color: #e2e8f0;
        }
        /* Boîte d'alerte orange exacte */
        .alert-box-orange {
            background-color: #f97316;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            text-align: center;
        }
        .alert-box-orange p {
            margin: 0 0 6px 0;
            font-size: 14.5px;
            font-weight: 500;
        }
        .alert-box-orange strong {
            font-size: 19px;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }
        /* Groupe de boutons */
        .buttons-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            flex: 1;
            padding: 13px 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Vrai logo d'origine (Mets ton lien d'image ici ou ton fichier local) -->
        <img src="VOTRE_LIEN_OU_NOM_DU_LOGO.png" alt="Logo ASTER" class="logo">
        
        <h2>Contrôle des Sorties</h2>

        <!-- Avatar du Membre -->
        <div class="avatar-container">
            <img id="member-avatar" src="" alt="Photo membre" class="avatar">
        </div>

        <!-- Zone dynamique -->
        <div id="dynamic-content">
            <!-- Inséré dynamiquement par le script -->
        </div>
    </div>

    <script>
        function afficherResultat(response) {
            const avatarImg = document.getElementById('member-avatar');
            const dynamicContent = document.getElementById('dynamic-content');

            if (response.photoUrl) {
                avatarImg.src = response.photoUrl;
            }

            if (response.status === "require_survey") {
                dynamicContent.innerHTML = `
                    <div class="alert-box-orange">
                        <p>⚠️ Veuillez remplir l'enquête de satisfaction avant de sortir.</p>
                        <strong>${response.nom}</strong>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" onclick="ouvrirEnquete('${response.id}')">Remplir l'enquête</button>
                        <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
                    </div>
                `;
            } else if (response.status === "success") {
                dynamicContent.innerHTML = `
                    <div style="background-color: #10b981; color: white; padding: 20px; border-radius: 12px; margin-bottom: 22px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
                        <p style="margin: 0 0 6px 0; font-size: 14.5px; font-weight: bold;">✓ SORTIE ENREGISTRÉE</p>
                        <strong style="font-size: 19px; text-transform: uppercase;">${response.nom}</strong>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
                    </div>
                `;
            }
        }

        function ouvrirEnquete(idMembre) {
            window.open("https://docs.google.com/forms/d/e/VOTRE_FORMULAIRE/viewform?entry.ID=" + idMembre, "_blank");
        }

        function nouveauScan() {
            location.reload();
        }
    </script>
</body>
</html>
