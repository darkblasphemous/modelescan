<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle des Sorties - ASTER</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 440px;
            box-sizing: border-box;
        }
        /* Logo ASTER stylisé en pur CSS/SVG pour éviter tout lien cassé */
        .logo-badge {
            width: 80px;
            height: 80px;
            background: #1e3a8a;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.2);
            border: 3px solid #93c5fd;
        }
        h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .avatar-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #10b981;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.2);
            background-color: #e2e8f0;
        }
        /* Boîte d'alerte orange exacte demandée */
        .alert-box-orange {
            background-color: #f97316;
            color: white;
            padding: 22px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            text-align: center;
        }
        .alert-box-orange p {
            margin: 0 0 8px 0;
            font-size: 15px;
            font-weight: 500;
        }
        .alert-box-orange strong {
            font-size: 20px;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }
        /* Groupe de boutons */
        .buttons-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Remplacement du logo par un badge propre sans lien externe -->
        <div class="logo-badge">ASTER</div>
        
        <h2>Contrôle des Sorties</h2>

        <!-- Avatar du Membre (Exemple avec Alan Wilder ou dynamique) -->
        <div class="avatar-container">
            <img id="member-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Photo membre" class="avatar">
        </div>

        <!-- Zone dynamique affichant directement le design orange demandé -->
        <div id="dynamic-content">
            <div class="alert-box-orange">
                <p>⚠️ Veuillez remplir l'enquête de satisfaction avant de sortir.</p>
                <strong>alan wilder</strong>
            </div>
            <div class="buttons-group">
                <button class="btn btn-primary" onclick="ouvrirEnquete()">Remplir l'enquête</button>
                <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
            </div>
        </div>
    </div>

    <script>
        // Fonction pour connecter avec votre script Apps Script par la suite
        function afficherResultat(response) {
            const avatarImg = document.getElementById('member-avatar');
            const dynamicContent = document.getElementById('dynamic-content');

            if (response.photoUrl) {
                avatarImg.src = response.photoUrl;
            }

            if (response.status === "require_survey") {
                dynamicContent.innerHTML = `
                    <div class="alert-box-orange">
                        <p>⚠️ Veuillez remplir l'enquête de satisfaction avant de sortir.</p>
                        <strong>${response.nom}</strong>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" onclick="ouvrirEnquete('${response.id}')">Remplir l'enquête</button>
                        <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
                    </div>
                `;
            } else if (response.status === "success") {
                dynamicContent.innerHTML = `
                    <div style="background-color: #10b981; color: white; padding: 22px 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
                        <p style="margin: 0 0 6px 0; font-size: 15px; font-weight: bold;">✓ SORTIE ENREGISTRÉE</p>
                        <strong style="font-size: 20px; text-transform: uppercase;">${response.nom}</strong>
                    </div>
                    <div class="buttons-group">
                        <button class="btn btn-primary" onclick="nouveauScan()">Scanner un autre</button>
                    </div>
                `;
            }
        }

        function ouvrirEnquete(idMembre) {
            window.open("https://docs.google.com/forms/d/e/VOTRE_FORMULAIRE/viewform", "_blank");
        }

        function nouveauScan() {
            location.reload();
        }
    </script>
</body>
</html>
