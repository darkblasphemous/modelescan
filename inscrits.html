<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Inscrits - ASTER</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 10px;
            object-fit: contain;
        }
        h2 {
            color: #1e293b;
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 15px 0;
            text-align: center;
        }
        .total-pill {
            background: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .badge-count {
            padding: 2px 8px;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: 800;
            background-color: #00c896;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px 16px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
            color: #334155;
        }
        .member-list {
            max-height: 440px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 4px;
            border-bottom: 1px solid #f1f5f9;
        }
        .member-item:last-child {
            border-bottom: none;
        }
        .member-photo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #e2e8f0;
        }
        .member-details {
            display: flex;
            flex-direction: column;
        }
        .member-name {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }
        .member-id {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="logo.png" alt="ASTER" class="logo">
        <h2>Liste des Inscrits</h2>

        <div class="total-pill">Total inscrits <span class="badge-count" id="count-total">0</span></div>

        <div class="card">
            <input type="text" id="search-input" class="search-box" placeholder="Rechercher un membre par nom ou ID..." oninput="filterMembers()">
            
            <div class="member-list" id="member-list">
                <p style="text-align: center; color: #94a3b8; padding: 15px;">Chargement...</p>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6dNuSW3ZwXRVIf9ppIeFe-ZT3_UvzDH5bN1BEYA-NGGf1Qxw0OYT9Efx6p7NRyqG5/exec";
        let allMembers = [];

        function fetchMembers() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    const list = data.members || (Array.isArray(data) ? data : []);
                    if (list.length > 0) {
                        allMembers = list;
                        document.getElementById("count-total").innerText = allMembers.length;
                        renderList(allMembers);
                    } else {
                        document.getElementById("member-list").innerHTML = `<p style="text-align:center; color:#94a3b8; padding: 15px;">Aucun membre trouvé.</p>`;
                    }
                })
                .catch(err => {
                    console.error("Erreur:", err);
                    document.getElementById("member-list").innerHTML = `<p style="text-align:center; color:#ef4444; padding: 15px;">Erreur lors du chargement.</p>`;
                });
        }

        function renderList(members) {
            const container = document.getElementById("member-list");
            if (members.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 15px;">Aucun résultat</p>`;
                return;
            }

            container.innerHTML = members.map(m => {
                let nom = m.nom || "Inconnu";
                let id = m.id || "";
                let photo = m.photoUrl || 'logo.png';

                return `
                    <div class="member-item">
                        <img src="${photo}" class="member-photo" alt="Photo" onerror="this.src='logo.png'">
                        <div class="member-details">
                            <div class="member-name">${nom}</div>
                            <div class="member-id">${id}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterMembers() {
            const query = document.getElementById("search-input").value.toLowerCase().trim();
            const filtered = allMembers.filter(m => {
                let nom = (m.nom || "").toLowerCase();
                let id = (m.id || "").toLowerCase();
                return nom.includes(query) || id.includes(query);
            });
            renderList(filtered);
        }

        fetchMembers();
        setInterval(fetchMembers, 5000);
    </script>
</body>
</html>
