<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Inscrits - ASTER</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .main-container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            width: 170px;
            height: auto;
            margin-bottom: 12px;
            object-fit: contain;
        }
        h2 {
            color: #1e293b;
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 10px 0;
            text-align: center;
        }
        
        /* Pilule "Total inscrits 18" */
        .total-pill {
            background: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .badge-count {
            background-color: #00c896;
            color: white;
            padding: 2px 9px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
        }

        /* Carte Principale */
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px 16px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
        }

        /* Champ de recherche */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
            color: #334155;
            background-color: #ffffff;
        }
        .search-box::placeholder {
            color: #94a3b8;
        }

        /* Liste Défilante */
        .member-list {
            max-height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        /* Personnalisation de la barre de défilement pour coller à la capture */
        .member-list::-webkit-scrollbar {
            width: 8px;
        }
        .member-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .member-list::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }

        /* Élément Membre */
        .member-item {
            display: flex;
            align-items: center;
            padding: 12px 4px;
            border-bottom: 1px solid #f1f5f9;
        }
        .member-item:last-child {
            border-bottom: none;
        }
        .member-photo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 14px;
            border: 1px solid #e2e8f0;
        }
        .member-details {
            display: flex;
            flex-direction: column;
        }
        .member-name {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }
        .member-id {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="logo.png" alt="ASTER" class="logo">
        <h2>Liste des Inscrits</h2>

        <div class="total-pill">
            Total inscrits <span class="badge-count" id="count-inscrits">0</span>
        </div>

        <div class="card">
            <input type="text" id="search-input" class="search-box" placeholder="Rechercher un membre par nom ou ID..." oninput="filterMembers()">
            
            <div class="member-list" id="member-list">
                <p style="text-align: center; color: #94a3b8;">Chargement des données...</p>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6dNuSW3ZwXRVIf9ppIeFe-ZT3_UvzDH5bN1BEYA-NGGf1Qxw0OYT9Efx6p7NRyqG5/exec";
        let allMembers = [];

        function fetchMembers() {
            fetch(`${SCRIPT_URL}?action=getMembers`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.members) {
                        allMembers = data.members;
                        document.getElementById("count-inscrits").innerText = allMembers.length;
                        renderList(allMembers);
                    }
                })
                .catch(err => {
                    document.getElementById("member-list").innerHTML = `<p style="text-align:center; color:#ef4444;">Erreur lors du chargement.</p>`;
                });
        }

        function renderList(members) {
            const container = document.getElementById("member-list");
            if (members.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 15px;">Aucun résultat</p>`;
                return;
            }

            container.innerHTML = members.map(m => `
                <div class="member-item">
                    <img src="${m.photoUrl || 'logo.png'}" class="member-photo" alt="Photo">
                    <div class="member-details">
                        <div class="member-name">${m.nom}</div>
                        <div class="member-id">${m.id}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterMembers() {
            const query = document.getElementById("search-input").value.toLowerCase().trim();
            const filtered = allMembers.filter(m => 
                m.nom.toLowerCase().includes(query) || 
                m.id.toLowerCase().includes(query)
            );
            renderList(filtered);
        }

        // Chargement au démarrage
        fetchMembers();
    </script>
</body>
</html>
