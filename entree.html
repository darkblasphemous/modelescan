  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
    }

    .logo-container {
      margin: 5px auto 10px auto;
      max-width: 150px;
      width: 100%;
    }
    
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      color: #333;
      margin: 5px 0 10px 0;
      font-size: 1.3em;
    }

    .scanner-card {
      max-width: 480px;
      width: 100%;
      margin: 0 auto 15px auto;
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    #video-preview {
      width: 100%;
      max-height: 250px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #222;
    }

    .manual-input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .manual-input-group input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9em;
      outline: none;
    }

    .manual-input-group button {
      padding: 10px 16px;
      background: #00b894;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
