<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f6f9">

  <title>Contrôle des Entrées - ASTER</title>

  <style>
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }

    .card-container {
      max-width: 440px;
      width: 100%;
      margin: 20px auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    .logo-container {
      margin: 0 auto 15px auto;
      max-width: 120px;
      width: 100%;
    }
    
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      color: #2d3748;
      margin: 5px 0 20px 0;
      font-size: 1.35em;
      font-weight: 700;
    }

    .user-photo-container {
      margin: 20px auto;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 4px;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      border: 3px solid #00b894;
      display: none;
    }

    .user-photo-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .status-box {
      margin: 20px 0;
      padding: 22px 15px;
      border-radius: 12px;
      text-align: center;
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      font-weight: bold;
      color: #ffffff;
    }

    .status-loading {
      background-color: #ebf8ff;
      color: #2b6cb0;
      border: 1px solid #bee3f8;
      display: block;
      font-weight: normal;
    }

    .status-success {
      background-color: #00b074;
    }

    .status-warning {
      background-color: #ff7f27;
    }

    .status-error {
      background-color: #e53e3e;
    }

    .msg-title {
      font-size: 1.05em;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
    }

    .msg-name {
      font-size: 1.3em;
      text-transform: uppercase;
      margin-top: 6px;
      font-weight: 800;
    }

    .msg-time {
      font-size: 0.85em;
      font-weight: 400;
      opacity: 0.9;
      margin-top: 6px;
    }

    .btn-action {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,123,255,0.2);
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #0056b3;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="logo-container">
      <img src="logo.png" alt="Logo ASTER" id="app-logo">
    </div>

    <h2>Contrôle des Entrées</h2>

    <div class="user-photo-container" id="photoContainer">
      <img id="userPhoto" src="" alt="Photo membre">
    </div>

    <div id="statusMsg" class="status-box status-loading">Scannez le badge du membre pour valider l'entrée</div>

    <div class="btn-container" id="actionButtons">
      <button class="btn-action" onclick="window.close()">Fermer / Terminer</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6dNuSW3ZwXRVIf9ppIeFe-ZT3_UvzDH5bN1BEYA-NGGf1Qxw0OYT9Efx6p7NRyqG5/exec";
    const ACTION = "entree";

    function afficherResultat(titre, nom, idMembre, heureTexte, type, photoUrl) {
      const msgBox = document.getElementById("statusMsg");
      const photoContainer = document.getElementById("photoContainer");
      const userPhoto = document.getElementById("userPhoto");

      msgBox.style.display = "block";
      msgBox.className = "status-box";

      if (type === "success") {
        msgBox.classList.add("status-success");
      } else if (type === "warning") {
        msgBox.classList.add("status-warning");
      } else if (type === "error") {
        msgBox.classList.add("status-error");
      } else {
        msgBox.classList.add("status-loading");
      }

      if (type === "loading") {
        msgBox.innerText = titre;
      } else {
        let heureHtml = heureTexte ? `<div class="msg-time">Heure : ${heureTexte}</div>` : '';
        msgBox.innerHTML = `
          <div class="msg-title">${titre}</div>
          <div class="msg-name">${nom}</div>
          ${heureHtml}
        `;
      }

      if (photoUrl && photoUrl.trim() !== "" && photoUrl.length > 5) {
        userPhoto.src = photoUrl;
        photoContainer.style.display = "block";
      } else {
        photoContainer.style.display = "none";
      }
    }

    window.addEventListener("load", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const memberId = urlParams.get('id') || urlParams.get('code');

      if (!memberId) {
        afficherResultat("❌ ERREUR", "Aucun identifiant", "Inconnu", "", "error", "");
        return;
      }

      const url = `${SCRIPT_URL}?action=${ACTION}&code=${encodeURIComponent(memberId)}`;

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error("Erreur réseau");
          return res.json();
        })
        .then(data => {
          const nomMembre = data.name || memberId;
          const nowTime = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          if (data.status === "ok") {
            afficherResultat("✓ ENTRÉE VALIDÉE", nomMembre, memberId, nowTime, "success", data.photo);
          } else if (data.status === "already_scanned") {
            afficherResultat("⚠ " + nomMembre + " est déjà enregistré comme présent !", "", memberId, nowTime, "warning", data.photo);
          } else {
            afficherResultat("❌ ERREUR", data.message || "Problème d'accès", memberId, "", "error", data.photo);
          }
        })
        .catch(err => {
          console.error(err);
          afficherResultat("❌ ERREUR", "Impossible de joindre le serveur", memberId, "", "error", "");
        });
    });
  </script>
</body>
</html>
