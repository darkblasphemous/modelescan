<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle des Entrées - ASTER</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
        .logo { width: 110px; height: 110px; margin: 0 auto 15px auto; object-fit: contain; display: block; }
        h2 { color: #1e293b; font-size: 22px; margin: 0 0 20px 0; font-weight: 700; }
        .member-photo { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid #00c896; margin: 0 auto 20px auto; display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-box { padding: 20px 15px; border-radius: 14px; color: white; margin-bottom: 20px; }
        .status-box.green { background-color: #00c896; }
        .status-box.orange { background-color: #f97316; }
        .status-box.red { background-color: #ef4444; }
        .status-box p { margin: 0 0 5px 0; font-size: 15px; font-weight: bold; }
        .status-box h3 { margin: 0; font-size: 20px; text-transform: uppercase; font-weight: 800; }
        .status-box .heure { font-size: 13px; margin-top: 5px; opacity: 0.9; }
        .btn { width: 100%; background-color: #0066ff; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,102,255,0.2); }
    </style>
</head>
<body>
    <div class="card" id="card-content">
        <img src="logo.png" alt="Logo ASTER" class="logo">
        <h2>Contrôle des Entrées</h2>
        <p>Validation en cours...</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYuWiLA5-jMB9R80HuidPP6NqR3qCXFMHOsAwSCOrt3JU4N5QBhGx-L_YdjJ2-Xuii1g/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('id') || urlParams.get('code');
        const container = document.getElementById("card-content");

        if (!code) {
            container.innerHTML = `
                <img src="logo.png" class="logo">
                <h2>Contrôle des Entrées</h2>
                <div class="status-box red"><p>⚠️ Erreur : Identifiant manquant</p></div>
            `;
        } else {
            fetch(`${SCRIPT_URL}?action=entree&code=${encodeURIComponent(code)}`)
                .then(res => res.json())
                .then(data => {
                    let photoHtml = data.photo ? `<img src="${data.photo}" class="member-photo">` : '';
                    if (data.status === "ok") {
                        container.innerHTML = `
                            <img src="logo.png" class="logo">
                            <h2>Contrôle des Entrées</h2>
                            ${photoHtml}
                            <div class="status-box green">
                                <p>✓ ENTRÉE VALIDÉE</p>
                                <h3>${data.name}</h3>
                                <div class="heure">Heure : ${data.heure}</div>
                            </div>
                            <button class="btn" onclick="window.close();">Fermer / Terminer</button>
                        `;
                    } else if (data.status === "already_scanned") {
                        container.innerHTML = `
                            <img src="logo.png" class="logo">
                            <h2>Contrôle des Entrées</h2>
                            ${photoHtml}
                            <div class="status-box orange">
                                <p>⚠️ ${data.name} est déjà enregistré comme présent !</p>
                                <div class="heure">Heure : ${data.heure || ''}</div>
                            </div>
                            <button class="btn" onclick="window.close();">Fermer / Terminer</button>
                        `;
                    } else {
                        container.innerHTML = `
                            <img src="logo.png" class="logo">
                            <h2>Contrôle des Entrées</h2>
                            <div class="status-box red"><p>${data.message}</p></div>
                        `;
                    }
                });
        }
    </script>
</body>
</html>
