<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f6f9">

  <title>Contrôle des Entrées - ASTER</title>

  <style>
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }

    .card-container {
      max-width: 440px;
      width: 100%;
      margin: 20px auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    .logo-container {
      margin: 0 auto 15px auto;
      max-width: 120px;
      width: 100%;
    }
    
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      color: #2d3748;
      margin: 5px 0 20px 0;
      font-size: 1.35em;
      font-weight: 700;
    }

    .user-photo-container {
      margin: 20px auto;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 4px;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      border: 3px solid #00b894;
      display: none;
    }

    .user-photo-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .status-box {
      margin: 20px 0;
      padding: 18px 15px;
      border-radius: 12px;
      font-size: 1.05em;
      text-align: center;
      font-weight: 600;
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .status-loading {
      background-color: #ebf8ff;
      color: #2b6cb0;
      border: 1px solid #bee3f8;
      display: block;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-warning {
      background-color: #ff7f27;
      color: #ffffff;
      border: none;
    }

    .status-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .btn-action {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,123,255,0.2);
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="logo-container">
      <img src="logo.png" alt="Logo ASTER" id="app-logo">
    </div>

    <h2>Contrôle des Entrées</h2>

    <div class="user-photo-container" id="photoContainer">
      <img id="userPhoto" src="" alt="Photo membre">
    </div>

    <div id="statusMsg" class="status-box status-loading">⏳ Analyse de l'identifiant en cours...</div>

    <button id="btnAnother" class="btn-action" onclick="window.close()">Fermer / Terminer</button>
  </div>

  <script>
    // Votre nouvelle URL de script Google Apps Script intégrée
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY5ZyTj5L2QXDzTKknCcEK5HKqVQOELj2wqb4otBXciSZanFQdd5PgY75iKaewHITF/exec";
    const ACTION = "entree";

    function afficherResultat(message, type, photoUrl) {
      const msgBox = document.getElementById("statusMsg");
      const photoContainer = document.getElementById("photoContainer");
      const userPhoto = document.getElementById("userPhoto");

      msgBox.style.display = "block";
      msgBox.className = "status-box";

      if (type === "success") {
        msgBox.classList.add("status-success");
      } else if (type === "warning") {
        msgBox.classList.add("status-warning");
      } else if (type === "error") {
        msgBox.classList.add("status-error");
      } else {
        msgBox.classList.add("status-loading");
      }

      msgBox.innerText = message;

      if (photoUrl && photoUrl.trim() !== "" && photoUrl.length > 5) {
        userPhoto.src = photoUrl;
        photoContainer.style.display = "block";
      } else {
        photoContainer.style.display = "none";
      }
    }

    window.addEventListener("load", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const memberId = urlParams.get('id') || urlParams.get('code');

      if (!memberId) {
        afficherResultat("❌ Aucun identifiant trouvé dans le lien (ex: ?id=XXXX).", "error", "");
        return;
      }

      const url = `${SCRIPT_URL}?action=${ACTION}&code=${encodeURIComponent(memberId)}`;

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error("Erreur réseau");
          return res.json();
        })
        .then(data => {
          if (data.status === "ok") {
            afficherResultat(`✅ Entrée validée avec succès !\n\n${data.name || memberId}`, "success", data.photo);
          } else if (data.status === "already_scanned") {
            afficherResultat(`⚠️ ${data.name || 'Ce membre'} est déjà enregistré comme présent !`, "warning", data.photo);
          } else {
            afficherResultat(`❌ ${data.message}`, "error", data.photo);
          }
        })
        .catch(err => {
          console.error(err);
          afficherResultat("❌ Impossible de joindre le serveur Google.", "error", "");
        });
    });
  </script>
</body>
</html>
