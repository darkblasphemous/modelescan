<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation Entrée - Saisie Identifiant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h2 { color: #333; margin-bottom: 20px; }
    
    .card {
      max-width: 450px;
      margin: 0 auto 20px auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    
    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 18px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #00b894;
    }

    button {
      padding: 14px 24px;
      background-color: #00b894;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #00a181;
    }

    #resultCard {
      display: none;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
      text-align: left;
      margin-bottom: 15px;
    }

    .user-info img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #eee;
      border: 2px solid #ddd;
    }

    .user-info .name {
      font-weight: bold;
      font-size: 1.2em;
      color: #2d3436;
    }

    .status-box {
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1em;
    }
    .status-ok { background: #e6f9f5; color: #00b894; border: 1px solid #a3e9d9; }
    .status-already { background: #fff9e6; color: #d68910; border: 1px solid #f9e29c; }
    .status-error { background: #ffecec; color: #d63031; border: 1px solid #f5b7b1; }
  </style>
</head>
<body>

  <h2>Validation Entrée</h2>

  <!-- Zone de Saisie Manuelle ou Douchette (Design d'origine) -->
  <div class="card">
    <form onsubmit="validerSaisie(event)">
      <div class="input-group">
        <input type="text" id="manualCode" placeholder="Entrez l'ID du membre..." autofocus autocomplete="off">
        <button type="submit">Valider</button>
      </div>
    </form>
  </div>

  <!-- Affichage de la Fiche Membre -->
  <div class="card" id="resultCard">
    <div class="user-info">
      <img id="userPhoto" src="https://via.placeholder.com/70" alt="Photo">
      <div id="userName" class="name">--</div>
    </div>
    <div id="statusBox" class="status-box">--</div>
  </div>

  <script>
    // ⚠️ Remplacez cette URL par votre NOUVELLE URL de déploiement Google Apps Script (/exec)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY5ZyTj5L2QXDzTKknCcEK5HKqVQOELj2wqb4otBXciSZanFQdd5PgY75iKaewHITF/execc";

    let isProcessing = false;

    // --- Lecture automatique si l'URL contient ?id=XXXXX ---
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const idFromUrl = urlParams.get('id');
      
      if (idFromUrl) {
        document.getElementById("manualCode").value = idFromUrl;
        envoyerCodeBackend(idFromUrl);
      }
    });

    function validerSaisie(e) {
      if (e) e.preventDefault(); 
      
      const input = document.getElementById("manualCode");
      const code = input.value.trim();
      
      if (code && !isProcessing) {
        envoyerCodeBackend(code);
      }
    }

    function envoyerCodeBackend(code) {
      isProcessing = true;
      const callbackName = "cb_" + Date.now();

      const statusBox = document.getElementById("statusBox");
      const resultCard = document.getElementById("resultCard");
      resultCard.style.display = "block";
      statusBox.className = "status-box";
      statusBox.style.background = "#f1f2f6";
      statusBox.style.color = "#2f3542";
      statusBox.innerText = "Validation en cours...";

      window[callbackName] = function(data) {
        nettoyerScript(callbackName);
        afficherResultat(data);
        isProcessing = false;
        document.getElementById("manualCode").value = ""; 
        document.getElementById("manualCode").focus(); 
      };

      const script = document.createElement("script");
      script.id = callbackName;
      script.src = `${SCRIPT_URL}?action=entree&code=${encodeURIComponent(code)}&callback=${callbackName}`;
      
      script.onerror = function() {
        nettoyerScript(callbackName);
        afficherResultat({
          status: "error",
          name: "Erreur réseau",
          message: "Impossible de joindre le serveur. Vérifiez votre connexion."
        });
        isProcessing = false;
        document.getElementById("manualCode").focus();
      };

      document.body.appendChild(script);
    }

    function nettoyerScript(id) {
      delete window[id];
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function afficherResultat(data) {
      const userPhoto = document.getElementById("userPhoto");
      const userName = document.getElementById("userName");
      const statusBox = document.getElementById("statusBox");

      userName.innerText = data.name || "Membre inconnu";
      userPhoto.src = (data.photo && data.photo.length > 10) ? data.photo : "https://via.placeholder.com/70?text=?";

      statusBox.className = "status-box";

      if (data.status === "ok") {
        statusBox.classList.add("status-ok");
      } else if (data.status === "already_scanned") {
        statusBox.classList.add("status-already");
      } else {
        statusBox.classList.add("status-error");
      }

      statusBox.innerText = data.message || "";
    }
  </script>
</body>
</html>
