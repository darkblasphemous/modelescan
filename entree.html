<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6dNuSW3ZwXRVIf9ppIeFe-ZT3_UvzDH5bN1BEYA-NGGf1Qxw0OYT9Efx6p7NRyqG5/exec";
    const ACTION = "entree";

    function afficherResultat(titre, nom, idMembre, heureTexte, type, photoUrl) {
      const msgBox = document.getElementById("statusMsg");
      const photoContainer = document.getElementById("photoContainer");
      const userPhoto = document.getElementById("userPhoto");

      msgBox.style.display = "block";
      msgBox.className = "status-box";

      if (type === "success") {
        msgBox.classList.add("status-success");
      } else if (type === "warning") {
        msgBox.classList.add("status-warning");
      } else if (type === "error") {
        msgBox.classList.add("status-error");
      } else {
        msgBox.classList.add("status-loading");
      }

      if (type === "loading") {
        msgBox.innerHTML = `⏳ ${titre}`; // Affiche un sablier pendant l'attente
      } else {
        let heureHtml = heureTexte ? `<div class="msg-time">Heure : ${heureTexte}</div>` : '';
        msgBox.innerHTML = `
          <div class="msg-title">${titre}</div>
          <div class="msg-name">${nom}</div>
          ${heureHtml}
        `;
      }

      if (photoUrl && photoUrl.trim() !== "" && photoUrl.length > 5) {
        userPhoto.src = photoUrl;
        photoContainer.style.display = "block";
      } else {
        photoContainer.style.display = "none";
      }
    }

    window.addEventListener("load", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const memberId = urlParams.get('id') || urlParams.get('code');

      if (!memberId) {
        afficherResultat("❌ ERREUR", "Aucun identifiant", "Inconnu", "", "error", "");
        return;
      }

      // Affiche immédiatement un message de patience pendant que Google Apps Script répond
      afficherResultat("Validation en cours, veuillez patienter...", "", memberId, "", "loading", "");

      const url = `${SCRIPT_URL}?action=${ACTION}&code=${encodeURIComponent(memberId)}`;

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error("Erreur réseau");
          return res.json();
        })
        .then(data => {
          const nomMembre = data.name || memberId;
          const nowTime = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          if (data.status === "ok") {
            afficherResultat("✓ ENTRÉE VALIDÉE", nomMembre, memberId, nowTime, "success", data.photo);
          } else if (data.status === "already_scanned") {
            afficherResultat("⚠ " + nomMembre + " est déjà enregistré comme présent !", "", memberId, nowTime, "warning", data.photo);
          } else {
            afficherResultat("❌ ERREUR", data.message || "Problème d'accès", memberId, "", "error", data.photo);
          }
        })
        .catch(err => {
          console.error(err);
          afficherResultat("❌ ERREUR", "Impossible de joindre le serveur", memberId, "", "error", "");
        });
    });
  </script>
